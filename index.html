<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Finance — Catatan Keuangan</title>
<style>
:root{
  --pink:#f472b6; --pink2:#ec4899; --soft:#fff1f7; --card:#ffffff;
  --text:#3f2635; --muted:#8f7180; --line:#f3dce7; --green:#25a36f; --red:#e85d75;
  --shadow:0 12px 35px rgba(190,80,130,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:linear-gradient(135deg,#fff7fb 0%,#fff 48%,#fff1f7 100%);color:var(--text)}
button,input,select{font:inherit}
.app{max-width:1180px;margin:auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:white;display:grid;place-items:center;font-size:22px;box-shadow:0 10px 25px rgba(236,72,153,.25)}
h1{font-size:25px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.month{background:white;border:1px solid var(--line);padding:11px 14px;border-radius:13px;color:var(--text);outline:none}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px}
.card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.card .label{color:var(--muted);font-size:13px}.amount{font-weight:800;font-size:25px;margin-top:8px}.income .amount{color:var(--green)}.expense .amount{color:var(--red)}
.balance{background:linear-gradient(135deg,#f9a8d4,#ec4899);color:#fff;border:0}.balance .label{color:#fff}.balance .amount{color:white}
.layout{display:grid;grid-template-columns:370px 1fr;gap:18px}
.form-card h2,.list-card h2{font-size:17px;margin:0 0 16px}
form{display:grid;gap:12px}
label{font-size:12px;font-weight:700;color:#705261}
input,select{width:100%;border:1px solid var(--line);background:#fff;padding:12px 13px;border-radius:12px;outline:none;color:var(--text)}
input:focus,select:focus{border-color:#f5a2c9;box-shadow:0 0 0 4px #fff0f7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{display:grid;grid-template-columns:1fr 1fr;background:#fff0f7;padding:4px;border-radius:12px}
.type button{border:0;background:transparent;padding:10px;border-radius:9px;color:var(--muted);cursor:pointer}.type button.active{background:#fff;color:var(--pink2);font-weight:800;box-shadow:0 4px 12px rgba(236,72,153,.12)}
.primary{border:0;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;padding:13px;border-radius:12px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(236,72,153,.2)}
.secondary{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 13px;border-radius:10px;cursor:pointer}
.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.filters{display:flex;gap:8px}.filters select{width:auto;padding:9px 11px}
table{width:100%;border-collapse:collapse}th,td{padding:13px 8px;border-bottom:1px solid #f5e8ee;text-align:left;font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}td:last-child{text-align:right}
.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff0f7;color:#b23971;font-size:11px;font-weight:700}
.plus{color:var(--green);font-weight:800}.minus{color:var(--red);font-weight:800}
.actions button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:5px}.actions button:hover{color:var(--pink2)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.footer{margin-top:15px;text-align:center;color:#a88c99;font-size:11px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.app{padding:18px 13px}.table-wrap{overflow:auto}table{min-width:650px}header{align-items:flex-start}.month{max-width:150px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">♥</div><div><h1>My Finance</h1><div class="sub">Catatan pemasukan & pengeluaran</div></div></div>
  <input id="monthFilter" class="month" type="month">
</header>

<section class="summary">
  <div class="card income"><div class="label">Total Pemasukan</div><div class="amount" id="incomeTotal">Rp 0</div></div>
  <div class="card expense"><div class="label">Total Pengeluaran</div><div class="amount" id="expenseTotal">Rp 0</div></div>
  <div class="card balance"><div class="label">Saldo</div><div class="amount" id="balanceTotal">Rp 0</div></div>
</section>

<div class="layout">
  <section class="card form-card">
    <h2 id="formTitle">Tambah Transaksi</h2>
    <form id="transactionForm">
      <div>
        <label>Jenis transaksi</label>
        <div class="type">
          <button type="button" class="active" data-type="income">Pemasukan</button>
          <button type="button" data-type="expense">Pengeluaran</button>
        </div>
      </div>
      <div><label>Jumlah</label><input id="amount" type="number" min="1" step="1" placeholder="Contoh: 150000" required></div>
      <div><label>Kategori</label><select id="category" required></select></div>
      <div><label>Keterangan</label><input id="note" type="text" maxlength="80" placeholder="Contoh: Gaji, makan, transport..." required></div>
      <div class="row">
        <div><label>Tanggal</label><input id="date" type="date" required></div>
        <div><label>Catatan opsional</label><input id="extra" type="text" maxlength="50" placeholder="Opsional"></div>
      </div>
      <button class="primary" id="submitBtn">+ Simpan Transaksi</button>
      <button class="secondary" type="button" id="cancelBtn" style="display:none">Batal Edit</button>
    </form>
  </section>

  <section class="card list-card">
    <div class="toolbar">
      <div><h2 style="margin-bottom:4px">Riwayat Transaksi</h2><div class="sub" id="countText">0 transaksi</div></div>
      <div class="filters">
        <select id="typeFilter"><option value="all">Semua jenis</option><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select>
        <select id="categoryFilter"><option value="all">Semua kategori</option></select>
      </div>
    </div>
    <div class="table-wrap">
      <table><thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th>Jenis</th><th>Jumlah</th><th></th></tr></thead>
      <tbody id="tbody"></tbody></table>
    </div>
  </section>
</div>
<div class="footer">Data tersimpan otomatis di browser perangkat ini.</div>
</div>

<script>
const incomeCats=["Gaji","Bonus","Penjualan","Hadiah","Investasi","Lainnya"];
const expenseCats=["Makanan","Transportasi","Belanja","Tagihan","Hiburan","Kesehatan","Pendidikan","Lainnya"];
let transactions=JSON.parse(localStorage.getItem("pinkmoney_transactions")||"[]");
let selectedType="income", editingId=null;

const $=s=>document.querySelector(s);
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
function save(){localStorage.setItem("pinkmoney_transactions",JSON.stringify(transactions))}
function today(){return new Date().toISOString().slice(0,10)}
$("#date").value=today();

function updateCategories(){
  const cats=selectedType==="income"?incomeCats:expenseCats;
  $("#category").innerHTML=cats.map(x=>`<option>${x}</option>`).join("");
}
function updateCategoryFilter(){
  const current=$("#categoryFilter").value;
  const all=[...new Set(transactions.map(t=>t.category))].sort();
  $("#categoryFilter").innerHTML='<option value="all">Semua kategori</option>'+all.map(x=>`<option>${x}</option>`).join("");
  if(all.includes(current)) $("#categoryFilter").value=current;
}
function activeMonth(){
  return $("#monthFilter").value;
}
function filtered(){
  return transactions.filter(t=>{
    const m=activeMonth();
    return (!m||t.date.startsWith(m)) &&
      ($("#typeFilter").value==="all"||t.type===$("#typeFilter").value) &&
      ($("#categoryFilter").value==="all"||t.category===$("#categoryFilter").value);
  }).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
}
function render(){
  const data=filtered();
  let inc=0,exp=0;
  data.forEach(t=>t.type==="income"?inc+=t.amount:exp+=t.amount);
  $("#incomeTotal").textContent=rupiah(inc); $("#expenseTotal").textContent=rupiah(exp); $("#balanceTotal").textContent=rupiah(inc-exp);
  $("#countText").textContent=`${data.length} transaksi`;
  $("#tbody").innerHTML=data.length?data.map(t=>`
    <tr>
      <td>${new Date(t.date+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})}</td>
      <td><span class="tag">${escapeHtml(t.category)}</span></td>
      <td>${escapeHtml(t.note)}${t.extra?`<div style="font-size:10px;color:#aa909c;margin-top:3px">${escapeHtml(t.extra)}</div>`:""}</td>
      <td>${t.type==="income"?'<span class="plus">Pemasukan</span>':'<span class="minus">Pengeluaran</span>'}</td>
      <td class="${t.type==="income"?"plus":"minus"}">${t.type==="income"?"+":"−"} ${rupiah(t.amount)}</td>
      <td class="actions"><button onclick="editTx(${t.id})" title="Edit">✎</button><button onclick="deleteTx(${t.id})" title="Hapus">×</button></td>
    </tr>`).join(""):`<tr><td colspan="6"><div class="empty">Belum ada transaksi untuk filter ini ✨</div></td></tr>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

document.querySelectorAll(".type button").forEach(btn=>btn.onclick=()=>{
  selectedType=btn.dataset.type;
  document.querySelectorAll(".type button").forEach(b=>b.classList.toggle("active",b===btn));
  updateCategories();
});
$("#transactionForm").onsubmit=e=>{
  e.preventDefault();
  const obj={id:editingId||Date.now(),type:selectedType,amount:Number($("#amount").value),category:$("#category").value,note:$("#note").value.trim(),date:$("#date").value,extra:$("#extra").value.trim()};
  if(editingId){transactions=transactions.map(t=>t.id===editingId?obj:t)}else transactions.push(obj);
  save(); resetForm(); updateCategoryFilter(); render();
};
function editTx(id){
  const t=transactions.find(x=>x.id===id); if(!t)return;
  editingId=id;selectedType=t.type;
  document.querySelectorAll(".type button").forEach(b=>b.classList.toggle("active",b.dataset.type===selectedType));
  updateCategories();$("#amount").value=t.amount;$("#category").value=t.category;$("#note").value=t.note;$("#date").value=t.date;$("#extra").value=t.extra||"";
  $("#formTitle").textContent="Edit Transaksi";$("#submitBtn").textContent="Simpan Perubahan";$("#cancelBtn").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}
function deleteTx(id){if(confirm("Hapus transaksi ini?")){transactions=transactions.filter(t=>t.id!==id);save();updateCategoryFilter();render()}}
function resetForm(){editingId=null;$("#transactionForm").reset();$("#date").value=today();$("#formTitle").textContent="Tambah Transaksi";$("#submitBtn").textContent="+ Simpan Transaksi";$("#cancelBtn").style.display="none";selectedType="income";document.querySelectorAll(".type button").forEach(b=>b.classList.toggle("active",b.dataset.type==="income"));updateCategories()}
$("#cancelBtn").onclick=resetForm;
$("#monthFilter").value=new Date().toISOString().slice(0,7);
$("#monthFilter").onchange=render;$("#typeFilter").onchange=render;$("#categoryFilter").onchange=render;
updateCategories();updateCategoryFilter();render();
</script>
</body>
</html>
